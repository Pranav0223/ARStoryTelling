<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Scene — Storytelling</title>

  <!-- Three.js ES module import map -->
  <script type="importmap">
  {
    "imports": {
      "three":          "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
      "three/addons/":  "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"
    }
  }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }

    /* Three.js canvas fills screen */
    canvas { display: block; position: fixed; inset: 0; }

    /* ── Pre-AR start screen ──────────────────────────────────────── */
    #start-screen {
      position: fixed; inset: 0;
      background: #0d1117;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 16px; padding: 40px; text-align: center;
      z-index: 10;
    }
    #start-screen h2 { font-size: 1.3rem; font-weight: 700; color: #f1f5f9; }
    #start-screen .story-name {
      font-size: 0.8rem; font-weight: 600;
      color: #6366f1; letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    #start-screen .chars {
      font-size: 0.9rem; color: #64748b;
      max-width: 300px; line-height: 1.6;
    }
    #start-btn {
      margin-top: 8px;
      padding: 15px 40px;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.15s, transform 0.1s;
    }
    #start-btn:active:not(:disabled) { background: #4338ca; transform: scale(0.97); }
    #start-btn:disabled { opacity: 0.5; cursor: default; }
    .xr-note { font-size: 0.75rem; color: #374151; margin-top: 4px; }

    /* ── DOM Overlay (visible during WebXR session) ───────────────── */
    #overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding: 0 24px 52px;
      pointer-events: none;
      z-index: 5;
    }
    #overlay > * { pointer-events: auto; }

    .pill {
      padding: 10px 22px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 24px;
      color: #e2e8f0;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    #hint         { margin-bottom: 20px; }
    #loading-chars {
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }
    .sm-spin {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Story badge (top-center in AR) ──────────────────────────── */
    #story-badge {
      position: fixed; top: 52px; left: 50%; transform: translateX(-50%);
      padding: 6px 18px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 20px;
      color: #a5b4fc;
      font-size: 0.78rem; font-weight: 600;
      letter-spacing: 0.05em;
      white-space: nowrap;
      display: none;
      z-index: 6;
    }

    /* ── Error message ────────────────────────────────────────────── */
    #error-msg {
      position: fixed; bottom: 36px; left: 16px; right: 16px;
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
      z-index: 10;
    }
  </style>
</head>
<body>

<!-- Start screen shown before WebXR session -->
<div id="start-screen">
  <div class="story-name" id="ss-story"></div>
  <h2>Ready to enter AR</h2>
  <p class="chars" id="ss-chars"></p>
  <button id="start-btn">Start AR</button>
  <p class="xr-note">Requires Android Chrome with ARCore</p>
</div>

<!-- DOM overlay rendered inside the WebXR session -->
<div id="overlay">
  <div class="pill" id="hint">Move phone over a flat surface</div>
  <div class="pill" id="loading-chars" style="display:none">
    <div class="sm-spin"></div>
    <span>Loading characters&hellip;</span>
  </div>
</div>

<!-- Story badge visible during AR -->
<div id="story-badge"></div>
<div id="error-msg"></div>

<script type="module" src="./js/ar.js"></script>
</body>
</html>
