<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Capture — AR Storytelling</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #e2e8f0; font-family: system-ui, sans-serif; overflow: hidden; }

    /* Full-screen camera / preview */
    #video, #preview-img {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }
    #canvas { display: none; }

    /* Overlay */
    .overlay {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 52px 24px 44px;
      pointer-events: none;
    }
    .overlay > * { pointer-events: auto; }

    .top-bar {
      display: flex; align-items: center; gap: 14px;
    }
    .back-btn {
      width: 42px; height: 42px;
      background: rgba(0,0,0,0.5);
      border: none; border-radius: 50%;
      color: #fff; font-size: 1.2rem;
      cursor: pointer; display: flex;
      align-items: center; justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .top-title {
      font-size: 0.95rem; font-weight: 600;
      color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }

    /* Bottom controls */
    .bottom-bar {
      display: flex; flex-direction: column;
      align-items: center; gap: 18px;
    }

    /* Camera shutter */
    .shutter-ring {
      width: 76px; height: 76px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .shutter-ring:active .shutter-inner { transform: scale(0.88); }
    .shutter-inner {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.1s;
    }

    /* Preview actions */
    .action-row {
      display: flex; gap: 12px; width: 100%;
    }
    .action-btn {
      flex: 1; padding: 15px 0;
      border: none; border-radius: 12px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }
    .action-btn:active { opacity: 0.75; }
    .retake-btn {
      background: rgba(0,0,0,0.65);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .send-btn { background: #4f46e5; color: #fff; }

    /* Loading panel */
    #loading-panel {
      position: fixed; inset: 0;
      background: rgba(13,17,23,0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px;
      text-align: center;
    }
    .spinner {
      width: 56px; height: 56px;
      border: 4px solid #21262d;
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-title { font-size: 1.1rem; font-weight: 600; color: #f1f5f9; }
    .loading-sub   { font-size: 0.85rem; color: #64748b; line-height: 1.6; max-width: 280px; }
    .elapsed-row   { font-size: 0.8rem; color: #6366f1; font-variant-numeric: tabular-nums; }

    /* Error */
    #error-banner {
      position: fixed; bottom: 32px; left: 16px; right: 16px;
      background: #1a0a0a;
      border: 1px solid #7f1d1d;
      border-radius: 10px;
      padding: 12px 16px;
      color: #fca5a5;
      font-size: 0.85rem;
      display: none;
    }

    /* State visibility — JS toggles display on elements with data-state */
    [data-state] { display: none; }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <img id="preview-img" alt="Captured frame" style="display:none">
  <canvas id="canvas"></canvas>

  <!-- Overlay (always visible) -->
  <div class="overlay">
    <div class="top-bar">
      <button class="back-btn" onclick="history.back()">&#8592;</button>
      <span class="top-title" id="overlay-title">Point camera at scripture page</span>
    </div>

    <!-- Camera state: shutter button -->
    <div class="bottom-bar" data-state="camera">
      <div class="shutter-ring" id="capture-btn" role="button" aria-label="Capture photo">
        <div class="shutter-inner"></div>
      </div>
    </div>

    <!-- Preview state: retake + send -->
    <div class="bottom-bar" data-state="preview">
      <div class="action-row">
        <button class="action-btn retake-btn" id="retake-btn">&#8634; Retake</button>
        <button class="action-btn send-btn"   id="send-btn">Send to Pipeline &#8594;</button>
      </div>
    </div>
  </div>

  <!-- Loading panel (full-screen, shown over everything) -->
  <div id="loading-panel">
    <div class="spinner"></div>
    <div class="loading-title">Processing your scripture</div>
    <div class="loading-sub">
      Extracting characters, generating 3D models, rigging, and animating.
      This can take a few minutes.
    </div>
    <div class="elapsed-row">Elapsed: <span id="elapsed-time">0s</span></div>
  </div>

  <div id="error-banner"></div>

  <script src="./js/capture.js"></script>
</body>
</html>
